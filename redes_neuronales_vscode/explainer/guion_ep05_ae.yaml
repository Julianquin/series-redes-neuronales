# Episodio 05 · Autoencoders
# Promesas del gancho y su cierre:
#   cómo comprime -> s03 · fórmulas -> s04 · código -> s05 · qué se pierde -> s07 · pinceladas que no existen -> s08
episodio: 5
arquitectura: AE
titulo: Autoencoders
cabecera: AUTOENCODERS
tarjeta:
  usos: compresión · quitar ruido · detectar anomalías
  saber: "aprende sin etiquetas: la entrada es la respuesta"
siguiente: GAN
segmentos:
  - id: s01
    escena: hook
    seccion: ""
    texto: >-
      Este trocito de Van Gogh cabe en solo dos números, y una red neuronal lo reconstruye a partir de ellos.
      Hoy verás cómo comprime, sus fórmulas, su código, qué se pierde por el camino y cómo inventa pinceladas que no existen.
    cues: {dos: "dos", reconstruye: "reconstruye", comprime: "comprime,", formulas: "fórmulas,", codigo: "código,", pierde: "pierde", inventa: "inventa"}

  - id: s02
    escena: problem
    seccion: El problema
    texto: >-
      Hasta ahora, todas las redes tenían un profesor: alguien les daba la respuesta correcta. Pero la mayoría
      de los datos no tienen etiquetas. ¿Se puede aprender algo útil solo mirando los datos?
    cues: {profesor: "profesor:", etiquetas: "etiquetas.", mirando: "mirando"}

  - id: s03
    escena: idea
    seccion: El cuello de botella
    texto: >-
      La idea del autoencoder es obligar a la red a copiar su entrada pasando por un cuello de botella.
      Un codificador comprime el trocito, de setecientos sesenta y ocho números a solo dos, y un decodificador
      lo reconstruye. Si el cuello es estrecho, solo pasa lo esencial.
    cues: {copiar: "copiar", cuello: "cuello", codificador: "codificador", dos: "dos,", decodificador: "decodificador", esencial: "esencial."}

  - id: s04
    escena: formulas
    seccion: Las fórmulas
    texto: >-
      En fórmulas: el codificador calcula zeta igual a efe de equis, y el decodificador, equis gorro igual a ge de zeta.
      La pérdida es la distancia entre la entrada y su copia, el error cuadrático. La propia entrada es la respuesta.
    cues: {codificador: "codificador", decodificador: "decodificador,", perdida: "pérdida", cuadratico: "cuadrático.", respuesta: "propia"}

  - id: s05
    escena: code
    seccion: El código
    texto: >-
      En código son dos redes densas encadenadas. El codificador termina en dos neuronas sin activación; el
      decodificador, en una sigmoide, para dar colores entre cero y uno. Y la pérdida, el error cuadrático medio.
    cues: {codificador: "codificador", decodificador: "decodificador,", perdida: "pérdida,"}

  - id: s06
    escena: train
    seccion: Entrenando de verdad
    texto: >-
      La entrenamos con doce mil trocitos de cinco cuadros. Cada punto es un trozo, colocado según sus dos números.
      Al principio, todo está mezclado; poco a poco, los cuadros se separan solos, aunque nunca le dijimos cuál era cuál.
    cues: {punto: "punto", principio: "principio,", separan: "separan", nunca: "nunca"}

  - id: s07
    escena: lost
    seccion: Qué se pierde
    texto: >-
      ¿Qué se pierde por el camino? Con dos números guarda el color y la luz, pero no la forma de la pincelada.
      Con treinta y dos recupera algo de forma: cuanto más ancho el cuello, mejor la copia.
    cues: {dos: "dos", color: "color", treinta: "treinta", ancho: "ancho"}

  - id: s08
    escena: walk
    seccion: Pinceladas nuevas
    texto: >-
      Y como el espacio es continuo, podemos movernos por él y decodificar puntos que no son de ningún trozo:
      mezclas entre Hokusai, Van Gogh, Turner y Munch que la red nunca vio.
    cues: {continuo: "continuo,", movernos: "movernos", mezclas: "mezclas", nunca: "nunca"}

  - id: s09
    escena: when
    seccion: Cuándo usarlo
    texto: >-
      Se usan para comprimir, quitar ruido y detectar anomalías: lo que la red no sabe reconstruir, probablemente es raro.
      Su límite: su espacio tiene huecos, y lo que sale de ellos no suele parecer real.
    cues: {comprimir: "comprimir,", anomalias: "anomalías:", raro: "probablemente", limite: "límite:"}

  - id: s10
    escena: next
    seccion: Siguiente
    texto: >-
      Para inventar de verdad, dos redes compiten: una falsifica y la otra detecta. Son las GAN, en el próximo episodio.
    cues: {compiten: "compiten:", falsifica: "falsifica", gan: "GAN,"}

clave: [autoencoder, autoencoders, codificador, decodificador, cuello, botella, esencial, GAN, anomalías]
pronunciacion:
  autoencoder: autoencóder
  autoencoders: autoencóders
  GAN: gan
